<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Sellwave Web</title>
<style>
  /* Cores canonicas da SellWave (as mesmas do src/index.css da dash). */
  :root {
    --verde: #24c278;
    --verde-fraco: rgba(36, 194, 120, .14);
    --barra: #05070c;
    --fundo: #0b0e14;
    --card: #171c27;
    --linha: rgba(255, 255, 255, .07);
    --texto: #e8ecf3;
    --apagado: #8b94a6;
    --ambar: #f5a524;
    --vermelho: #f0506a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; background: var(--fundo); color: var(--texto);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    overflow: hidden; user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* ─────────────── barra lateral ─────────────── */
  aside {
    width: 268px; flex: 0 0 268px; height: 100vh; background: var(--barra);
    border-right: 1px solid var(--linha); display: flex; flex-direction: column;
  }
  .marca { display: flex; align-items: center; gap: 9px; padding: 16px 16px 12px; }
  .marca .ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 0 3px var(--verde-fraco); }
  .marca h1 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
  .marca span { margin-left: auto; font-size: 10.5px; color: var(--apagado); font-variant-numeric: tabular-nums; }

  .trava {
    margin: 0 12px 10px; padding: 9px 11px; border-radius: 9px;
    border: 1px solid var(--linha); background: rgba(255, 255, 255, .02);
    display: flex; align-items: center; gap: 9px; font-size: 11.5px;
  }
  .trava.ligada { border-color: rgba(36, 194, 120, .3); background: var(--verde-fraco); }
  .trava b { font-weight: 600; }
  .trava .cadeado { color: var(--verde); display: flex; }
  .trava.solta .cadeado { color: var(--ambar); }
  .trava.solta { border-color: rgba(245, 165, 36, .3); background: rgba(245, 165, 36, .1); }

  .busca { margin: 0 12px 8px; position: relative; }
  .busca input {
    width: 100%; padding: 7px 10px 7px 30px; border-radius: 8px;
    border: 1px solid var(--linha); background: rgba(255, 255, 255, .03);
    outline: none; font-size: 12.5px;
  }
  .busca input:focus { border-color: rgba(36, 194, 120, .45); }
  .busca svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--apagado); }

  .lista { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .lista::-webkit-scrollbar { width: 8px; }
  .lista::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .09); border-radius: 8px; }

  .rotulo { padding: 10px 8px 6px; font-size: 10px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--apagado); }

  .num {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 9px; text-align: left; position: relative; transition: background .12s;
  }
  .num:hover { background: rgba(255, 255, 255, .045); }
  .num.ativo { background: rgba(255, 255, 255, .07); }
  .num.ativo::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2.5px; border-radius: 3px; background: var(--verde); }
  .num .sinal { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: #39415266; }
  .num.aberto .sinal { background: var(--verde); }
  .num.carregando .sinal { background: var(--ambar); animation: pulsa 1.1s ease-in-out infinite; }
  .num.falhou .sinal { background: var(--vermelho); }
  @keyframes pulsa { 50% { opacity: .35; } }
  .num .corpo { min-width: 0; flex: 1; }
  .num .fone { font-size: 12.5px; font-weight: 550; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num .sub { font-size: 10.5px; color: var(--apagado); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num .px { flex: 0 0 auto; color: var(--apagado); display: flex; opacity: .75; }
  .num .px.sem { color: var(--ambar); opacity: 1; }

  .rodape { border-top: 1px solid var(--linha); padding: 8px; display: flex; gap: 6px; }
  .rodape button {
    flex: 1; padding: 7px; border-radius: 8px; font-size: 11.5px; color: var(--apagado);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rodape button:hover { background: rgba(255, 255, 255, .05); color: var(--texto); }

  /* ─────────────── area de conteudo ─────────────── */
  main { flex: 1; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .cartao {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--linha);
    border-radius: 14px; padding: 26px;
  }
  .cartao h2 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 4px; }
  .cartao p { font-size: 12.5px; color: var(--apagado); margin-bottom: 18px; }
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 11px; font-weight: 600; color: var(--apagado); margin-bottom: 5px; }
  .campo input {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--linha);
    background: rgba(255, 255, 255, .03); outline: none; font-size: 12.5px;
  }
  .campo input:focus { border-color: rgba(36, 194, 120, .5); }
  .principal {
    width: 100%; padding: 10px; border-radius: 9px; background: var(--verde); color: #04120b;
    font-size: 13px; font-weight: 650; margin-top: 6px;
  }
  .principal:hover { filter: brightness(1.07); }
  .principal:disabled { opacity: .5; cursor: default; }

  .vazio { text-align: center; max-width: 340px; }
  .vazio .icone { color: #2c3443; margin-bottom: 14px; display: flex; justify-content: center; }
  .vazio h2 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
  .vazio p { font-size: 12.5px; color: var(--apagado); }

  .aviso { margin-top: 14px; padding: 10px 12px; border-radius: 9px; font-size: 12px; display: none; }
  .aviso.erro { display: block; background: rgba(240, 80, 106, .12); border: 1px solid rgba(240, 80, 106, .3); color: #ffb3bf; }
  .aviso.ok { display: block; background: var(--verde-fraco); border: 1px solid rgba(36, 194, 120, .3); color: #8ff0bd; }

  /* ─────────────── janelinha ─────────────── */
  .fundo-modal { position: fixed; inset: 0; background: rgba(4, 6, 10, .72); display: none; align-items: center; justify-content: center; padding: 24px; }
  .fundo-modal.on { display: flex; }
  .linha2 { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  .acoes button { flex: 1; padding: 9px; border-radius: 9px; font-size: 12.5px; font-weight: 550; }
  .secundario { border: 1px solid var(--linha); color: var(--apagado); }
  .secundario:hover { background: rgba(255, 255, 255, .05); color: var(--texto); }
  .chave { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linha); }
  .chave:first-of-type { border-top: 0; }
  .chave .txt { flex: 1; }
  .chave .txt b { display: block; font-size: 12.5px; font-weight: 600; }
  .chave .txt span { font-size: 11px; color: var(--apagado); }
  .sw { width: 38px; height: 21px; border-radius: 99px; background: #2b3242; position: relative; flex: 0 0 38px; transition: background .15s; }
  .sw.on { background: var(--verde); }
  .sw::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw.on::after { transform: translateX(17px); }
</style>
</head>
<body>
  <aside>
    <div class="marca">
      <span class="ponto"></span>
      <h1>Sellwave Web</h1>
      <span id="versao"></span>
    </div>

    <button class="trava" id="trava" title="Clique para abrir as travas">
      <span class="cadeado">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span id="trava-txt"></span>
    </button>

    <div class="busca">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" placeholder="Procurar número" spellcheck="false" />
    </div>

    <div class="lista" id="lista"></div>

    <div class="rodape">
      <button id="atualizar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Atualizar
      </button>
      <button id="sair">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <main id="palco"></main>

  <div class="fundo-modal" id="modal">
    <div class="cartao" id="modal-corpo"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
