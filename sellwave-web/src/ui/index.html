<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>SellWave Web</title>
<style>
  /* Cores canonicas da SellWave (as mesmas do src/index.css da dash). */
  :root {
    --verde: #24c278;
    --verde-fraco: rgba(36, 194, 120, .14);
    --barra: #05070c;
    --fundo: #0b0e14;
    --card: #171c27;
    --linha: rgba(255, 255, 255, .07);
    --texto: #e8ecf3;
    --apagado: #8b94a6;
    --ambar: #f5a524;
    --vermelho: #f0506a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; background: var(--fundo); color: var(--texto);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    overflow: hidden; user-select: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* ─────────────── barra lateral ─────────────── */
  /* AS DUAS LARGURAS SAO AS DO main.js (LARGURA_BARRA e LARGURA_BARRA_MIN). Quem manda na geometria
     e ele, porque e ele que posiciona a view do WhatsApp: numero diferente aqui faria a view passar
     por baixo da barra ou sobrar um vao. Mudou la, muda aqui. */
  aside {
    width: 268px; flex: 0 0 268px; height: 100vh; background: var(--barra);
    border-right: 1px solid var(--linha); display: flex; flex-direction: column;
    transition: width .14s ease, flex-basis .14s ease;
  }
  /* ENCOLHIDA, NAO ESCONDIDA (pedido do Bruno em 16/10: "na versao da coluna esquerda, eu gostaria
     que ainda ficasse uma coluna fininha mostrando o numero, algo que seja relevante"). Some o que
     e texto de apoio; fica o que diz de qual numero se trata e como ele esta. */
  body.fina aside { width: 56px; flex-basis: 56px; }
  body.fina .marca img, body.fina .marca span, body.fina .busca,
  body.fina .trava, body.fina #fila, body.fina #preview, body.fina #versao-nova { display: none; }
  body.fina .marca { padding: 13px 0 10px; justify-content: center; }
  body.fina .lista { padding: 2px 6px 8px; }
  body.fina .rodape { flex-direction: column; padding: 6px; }
  body.fina .rodape button { font-size: 0; padding: 8px 0; justify-content: center; gap: 0; }
  body.fina .rodape button svg { width: 15px; height: 15px; }

  .encolhe { display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 24px;
    border-radius: 7px; color: var(--apagado); transition: background .12s, color .12s; }
  .encolhe:hover { background: rgba(255, 255, 255, .06); color: var(--texto); }
  .encolhe svg { width: 14px; height: 14px; transition: transform .14s; }
  body.fina .encolhe svg { transform: rotate(180deg); }

  /* a linha do numero na barra fina: ponto, 4 digitos e o contador, um embaixo do outro */
  .fino { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 2px; border-radius: 9px; transition: background .12s; }
  .fino:hover { background: rgba(255, 255, 255, .05); }
  .fino.ativo { background: rgba(255, 255, 255, .08); }
  .fino .d { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .fino .c { font-size: 9px; font-variant-numeric: tabular-nums; color: var(--apagado); }
  .fino .sinal, .fino .pos { margin: 0 0 1px; }
  /* A BARRINHA LARANJA DA BARRA ENCOLHIDA: daqui pra baixo, numero em aquecimento. Encolhida nao
     cabe cabecalho, entao a separacao e a propria barra - com o foguinho em cima dela, que e o
     mesmo sinal que a linha larga usa. */
  .risco-aq { display: flex; align-items: center; justify-content: center;
    margin: 9px 1px 5px; padding-top: 7px; color: #f59e0b;
    border-top: 2px solid rgba(245, 158, 11, .5); }

  /* ─────────────── a abinha de voltar o painel ───────────────
     O painel escondido deixa uma FRESTA de 22px (main.js), e ela existe SO pra isto. Antes nao
     sobrava pixel nenhum e o unico caminho de volta era Ajustes - foi onde o Bruno se perdeu:
     "cliquei sem querer numa setinha que esconde o painel, porem eu nao consegui abrir de volta". */
  .fresta { position: fixed; top: 0; right: 0; width: 22px; height: 100vh; z-index: 5;
    display: none; align-items: center; justify-content: center;
    background: var(--barra); border-left: 1px solid var(--linha);
    color: var(--apagado); transition: background .12s, color .12s; }
  body.sem-painel .fresta { display: flex; }
  .fresta:hover { background: rgba(255, 255, 255, .06); color: var(--texto); }
  .fresta svg { width: 13px; height: 13px; }
  .marca { display: flex; align-items: center; gap: 9px; padding: 15px 16px 12px; }
  .marca img { height: 17px; width: auto; display: block; }
  .marca span { margin-left: auto; font-size: 10.5px; color: var(--apagado); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .trava {
    margin: 0 12px 10px; padding: 9px 11px; border-radius: 9px;
    border: 1px solid var(--linha); background: rgba(255, 255, 255, .02);
    display: flex; align-items: center; gap: 9px; font-size: 11.5px; width: calc(100% - 24px);
  }
  .trava.ligada { border-color: rgba(36, 194, 120, .3); background: var(--verde-fraco); }
  .trava b { font-weight: 600; }
  .trava .cadeado { color: var(--verde); display: flex; }
  .trava.solta .cadeado { color: var(--ambar); }
  .trava.solta { border-color: rgba(245, 165, 36, .3); background: rgba(245, 165, 36, .1); }
  .trava[hidden] { display: none; }

  .busca { margin: 0 12px 8px; position: relative; }
  .busca input {
    width: 100%; padding: 7px 10px 7px 30px; border-radius: 8px;
    border: 1px solid var(--linha); background: rgba(255, 255, 255, .03);
    outline: none; font-size: 12.5px;
  }
  .busca input:focus { border-color: rgba(36, 194, 120, .45); }
  .busca svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--apagado); }

  .lista { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .lista::-webkit-scrollbar { width: 8px; }
  .lista::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .09); border-radius: 8px; }

  /* Cabecalho de vendedor: a lista e agrupada por quem atende. */
  .vend {
    display: flex; align-items: center; gap: 7px; padding: 12px 8px 6px;
    font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--apagado);
  }
  /* AQUECIMENTO TEM AREA PROPRIA, na cor que o resto do sistema ja usa pra isso (a mesma ambar da
     Contingencia). Antes o numero em aquecimento ficava solto no fim da lista do vendedor, sem nada
     dizendo o que era: "aquele numero ali, ele so esta simplesmente jogado ali". */
  .vend.aquec { color: #f59e0b; }
  .vend.aquec .risco { background: rgba(245, 158, 11, .28); }
  .vend.aquec .qtd { background: rgba(245, 158, 11, .14); color: #f59e0b; }
  /* No lugar do interruptor de quem nao pode receber. Selo apagado, nao botao: nao ha o que clicar. */
  .sw-off { display: grid; place-items: center; width: 38px; height: 21px; flex: 0 0 38px;
    border-radius: 9999px; border: 1px dashed var(--linha); color: rgba(148, 163, 184, .45);
    font-size: 11px; line-height: 1; cursor: default; }
  .vend .risco { flex: 1; height: 1px; background: var(--linha); }
  .vend .qtd { font-variant-numeric: tabular-nums; opacity: .8; letter-spacing: 0; }

  .num {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 9px; text-align: left; position: relative; transition: background .12s;
  }
  /* O QUE ESTA RECEBENDO LEAD AGORA (16/10/2026, pedido do Bruno: "gostaria que tivesse um contorno
     ali no fundo desse numero, indicando que aquele numero esta recebendo leads nesse exato
     momento. Sei que ja aparece escrito que esta recebendo, mas gostaria de um destaquezinho").
     O texto ja dizia; o que faltava era achar sem ler. Contorno e fundo na cor de quem recebe, mais
     uma barrinha na borda esquerda - de relance, e o unico que se destaca na coluna. */
  .num.recebendo {
    background: rgba(36, 194, 120, .08);
    box-shadow: inset 0 0 0 1px rgba(36, 194, 120, .45);
  }
  .num.recebendo::before {
    content: ''; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px;
    border-radius: 0 3px 3px 0; background: #24c278;
  }
  .num.recebendo:hover { background: rgba(36, 194, 120, .13); }
  /* na barra encolhida o contorno e o mesmo, so sem a barrinha (nao ha margem pra ela) */
  .fino.recebendo { background: rgba(36, 194, 120, .1); box-shadow: inset 0 0 0 1px rgba(36, 194, 120, .45); }
  .num:hover { background: rgba(255, 255, 255, .045); }
  .num.ativo { background: rgba(255, 255, 255, .07); }
  .num.ativo::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2.5px; border-radius: 3px; background: var(--verde); }
  .num .sinal { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: #39415266; }
  .num.carregando .sinal { animation: pulsa 1.1s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .3; } }
  .num .corpo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .num .fone { font-size: 12.5px; font-weight: 550; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num .sub { font-size: 10.5px; color: var(--apagado); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .num .sub .zap { color: var(--verde); display: inline-flex; }
  /* O DIA DO AQUECIMENTO, a esquerda do icone do WhatsApp. Ambar, a mesma cor que o cabecalho da
     area e a Contingencia usam pra aquecimento - cor repetida e o que faz a pessoa ligar as duas
     telas sem ler nada. */
  .num .sub .aq { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto;
    padding: 1px 5px 1px 4px; border-radius: 5px; font-size: 9.5px; font-weight: 700;
    letter-spacing: -.01em; color: #f59e0b; background: rgba(245, 158, 11, .13);
    border: 1px solid rgba(245, 158, 11, .3); }
  .num .sub .aq svg { flex: 0 0 10px; }
  .num .sub .zap.off { color: #4b5566; }
  .num .sub .alerta { color: var(--ambar); display: inline-flex; }
  .num .sub .trancado { color: #f0506a; display: inline-flex; }

  /* A POSICAO NA FILA no lugar do ponto, e o contador com a barra na base. Medidas e cores saem do
     spec tirado da Chegada de leads (_coordenacao/SPEC-lista-numeros-vendedor.md): as duas telas
     mostram o mesmo estado, entao tem que parecer a mesma coisa. */
  .num .pos { flex: 0 0 20px; width: 20px; height: 20px; display: grid; place-items: center;
    border-radius: 50%; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--pc); border: 1px solid color-mix(in srgb, var(--pc) 45%, transparent);
    background: color-mix(in srgb, var(--pc) 12%, transparent); }
  .num .cnt { position: relative; display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px 3px; border-radius: 6px; font-size: 10px; font-weight: 700;
    font-variant-numeric: tabular-nums; overflow: hidden; color: var(--cc);
    border: 1px solid color-mix(in srgb, var(--cc) 40%, transparent);
    background: color-mix(in srgb, var(--cc) 6%, transparent); }
  .num .cnt i { font-style: normal; font-weight: 600; opacity: .85; }
  .num .cnt b { position: absolute; left: 0; bottom: 0; height: 2px;
    background: color-mix(in srgb, var(--cc) 40%, transparent); }
  /* FECHAR O NAVEGADOR DAQUELE NUMERO, na propria linha.
     Pedido do Bruno em 16/10: "gostaria que tivesse um botao de abrir e fechar o navegador". Abrir
     ja era o clique na linha; fechar so existia no X do painel e no Ctrl+W - e quem desliga o
     painel nos Ajustes ficava SEM saida nenhuma. So aparece na linha que esta aberta. */
  .num .fecha { flex: 0 0 18px; width: 18px; height: 18px; display: grid; place-items: center;
    border-radius: 5px; color: var(--apagado); opacity: 0; transition: opacity .12s, background .12s, color .12s; }
  .num:hover .fecha, .num.ativo .fecha { opacity: 1; }
  .num .fecha:hover { background: rgba(255, 255, 255, .09); color: var(--texto); }
  .num .px { flex: 0 0 auto; color: var(--apagado); display: flex; opacity: .75; margin-left: 2px; }
  .num .px.sem { color: var(--ambar); opacity: 1; }
  .num .px[hidden] { display: none; }

  /* Interruptor da roleta: quem recebe lead. */
  .sw { width: 32px; height: 18px; border-radius: 99px; background: #2b3242; position: relative; flex: 0 0 32px; transition: background .15s; }
  .sw.on { background: var(--verde); }
  .sw::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw.on::after { transform: translateX(14px); }
  .sw.ocupado { opacity: .5; }

  .rodape { border-top: 1px solid var(--linha); padding: 8px; display: flex; gap: 6px; }
  .rodape button {
    flex: 1; padding: 7px; border-radius: 8px; font-size: 11.5px; color: var(--apagado);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rodape button:hover { background: rgba(255, 255, 255, .05); color: var(--texto); }
  .fila-aviso { padding: 0 14px 6px; font-size: 10.5px; color: var(--ambar); }
  .fila-aviso:empty { display: none; }
  .versao-nova { display: flex; align-items: center; gap: 7px; width: calc(100% - 20px); margin: 0 10px 8px;
    padding: 8px 10px; border-radius: 9px; text-align: left; font-size: 11px; line-height: 1.35;
    color: var(--texto); border: 1px solid rgba(36, 194, 120, .32); background: var(--verde-fraco);
    transition: background .12s; }
  .versao-nova:hover { background: rgba(36, 194, 120, .18); }
  .versao-nova b { font-weight: 650; }
  .versao-nova[hidden] { display: none; }
  .preview { display: flex; align-items: center; gap: 7px; margin: 0 10px 8px; padding: 7px 10px;
    border-radius: 9px; font-size: 11px; color: #cfe3ff;
    border: 1px solid rgba(14, 165, 233, .35); background: rgba(14, 165, 233, .12); }
  .preview b { font-weight: 650; color: #fff; }
  .preview span { flex: 1; min-width: 0; }
  .preview button { font-size: 11px; color: #9ecbff; text-decoration: underline; text-underline-offset: 2px; }
  .preview button:hover { color: #fff; }
  .preview[hidden] { display: none; }
  /* A versao, discreta, no canto do titulo do dialogo. */
  #modal h2 { position: relative; }
  #modal h2 .ver { position: absolute; right: 0; bottom: 2px; font-size: 10.5px; font-weight: 500;
    color: var(--apagado); font-variant-numeric: tabular-nums; }

  /* LISTA PROPRIA, NAO <select> (16/10: "os select ficam brancos e so dao pra ler passando o
     mouse"). O <option> nativo no Windows e desenhado pelo sistema e ignora o tema: num painel
     escuro vira mancha branca ilegivel. Vale pra este e pro tratamento do painel. */
  .escolha { position: relative; min-width: 150px; }
  .escolha > button { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 9px;
    font-size: 12px; color: var(--texto); border: 1px solid var(--linha); border-radius: 8px;
    background: rgba(255, 255, 255, .03); text-align: left; }
  .escolha > button .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .escolha > button svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--apagado); transition: transform .15s; }
  .escolha.aberta > button { border-color: rgba(255, 255, 255, .22); }
  .escolha.aberta > button svg { transform: rotate(180deg); }
  .escolha .ops { display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 30;
    min-width: 100%; max-height: 220px; overflow-y: auto; padding: 4px; border-radius: 10px;
    border: 1px solid var(--linha); background: #10161f; box-shadow: 0 10px 28px rgba(0, 0, 0, .6); }
  .escolha.aberta .ops { display: block; }
  .escolha .ops button { display: block; width: 100%; padding: 7px 9px; border-radius: 7px;
    font-size: 12px; text-align: left; color: var(--texto); white-space: nowrap; }
  .escolha .ops button:hover { background: rgba(255, 255, 255, .07); }
  .escolha .ops button.on { background: rgba(36, 194, 120, .16); color: var(--verde, #24c278); font-weight: 700; }

  /* Campos da janelinha de proxy. Mesmo desenho dos campos da dash: rotulo pequeno em cima,
     caixa escura, foco verde. */
  .campo { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; min-width: 0; }
  .campo label { font-size: 11px; color: var(--apagado); }
  .campo input { width: 100%; padding: 8px 10px; font-size: 12.5px; color: var(--texto);
    border: 1px solid var(--linha); border-radius: 8px; background: rgba(255, 255, 255, .03); outline: none; }
  .campo input:focus { border-color: rgba(36, 194, 120, .55); }
  .campo-par { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .campo-par .campo-curto { max-width: 110px; }

  /* ─────────────── area de conteudo ─────────────── */
  main { flex: 1; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
  .cartao {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--linha);
    border-radius: 14px; padding: 26px;
  }
  .cartao h2 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 4px; }
  .cartao p { font-size: 12.5px; color: var(--apagado); margin-bottom: 18px; }
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 11px; font-weight: 600; color: var(--apagado); margin-bottom: 5px; }
  .campo input {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--linha);
    background: rgba(255, 255, 255, .03); outline: none; font-size: 12.5px;
  }
  .campo input:focus { border-color: rgba(36, 194, 120, .5); }
  .principal {
    width: 100%; padding: 10px; border-radius: 9px; background: var(--verde); color: #04120b;
    font-size: 13px; font-weight: 650; margin-top: 6px;
  }
  .principal:hover { filter: brightness(1.07); }
  .principal:disabled { opacity: .5; cursor: default; }

  .vazio { text-align: center; max-width: 360px; }
  /* A TELA DA SESSAO: o simbolo grande, o numero e o botao. Clicar no numero NAO abre o WhatsApp
     direto - abre esta tela, e o botao e que pede a vez ao servidor. */
  .abrir { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 24px; text-align: center; }
  .abrir .zapg { color: var(--verde); opacity: .9; margin-bottom: 10px; }
  .abrir .zapg svg { width: 84px; height: 84px; }
  .abrir .zapg.trancado { color: #3a4152; opacity: 1; }
  .abrir h2 { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .abrir .de { font-size: 13px; color: var(--apagado); }
  .abrir .dica { font-size: 12px; color: var(--apagado); max-width: 320px; margin: 8px 0 10px; }
  .abrir .principal { min-width: 180px; }

  .vazio .icone { color: #2c3443; margin-bottom: 14px; display: flex; justify-content: center; }
  .vazio h2 { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
  .vazio p { font-size: 12.5px; color: var(--apagado); }

  .aviso { margin-top: 14px; padding: 10px 12px; border-radius: 9px; font-size: 12px; display: none; }
  .aviso.erro { display: block; background: rgba(240, 80, 106, .12); border: 1px solid rgba(240, 80, 106, .3); color: #ffb3bf; }
  .aviso.ok { display: block; background: var(--verde-fraco); border: 1px solid rgba(36, 194, 120, .3); color: #8ff0bd; }

  /* ─────────────── janelinha ─────────────── */
  .fundo-modal { position: fixed; inset: 0; background: rgba(4, 6, 10, .72); display: none; align-items: center; justify-content: center; padding: 24px; }
  .fundo-modal.on { display: flex; }
  .linha2 { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  .acoes button { flex: 1; padding: 9px; border-radius: 9px; font-size: 12.5px; font-weight: 550; }
  .secundario { border: 1px solid var(--linha); color: var(--apagado); }
  .secundario:hover { background: rgba(255, 255, 255, .05); color: var(--texto); }
  .chave { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--linha); }
  .chave:first-of-type { border-top: 0; }
  .chave .txt { flex: 1; }
  .chave .txt b { display: block; font-size: 12.5px; font-weight: 600; }
  .chave .txt span { font-size: 11px; color: var(--apagado); }
  .chave .sw { width: 38px; height: 21px; flex: 0 0 38px; }
  .chave .sw::after { width: 16px; height: 16px; }
  .chave .sw.on::after { transform: translateX(17px); }
</style>
</head>
<body>
  <aside>
    <div class="marca">
      <img src="img/logo.png" alt="SellWave" />
      <span id="versao"></span>
      <button class="encolhe" id="encolhe" title="Encolher a barra">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>

    <button class="trava" id="trava" title="Travas e ajustes" hidden>
      <span class="cadeado">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span id="trava-txt"></span>
    </button>

    <div class="busca">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" placeholder="Procurar número" spellcheck="false" />
    </div>

    <div class="lista" id="lista"></div>
    <div id="fila" class="fila-aviso"></div>
    <!-- VERSAO NOVA. Fica acima do rodape, na mesma altura do aviso da fila, e so aparece quando
         ha versao mais nova publicada. O que nao da pra atualizar sozinho (processo principal,
         preloads, Electron) exige baixar de novo: o minimo e o vendedor SABER disso. -->
    <button id="versao-nova" class="versao-nova" hidden></button>
    <!-- Marca do "ver como": a tela muda MUITO no preview (some proxy, travas e os numeros dos
         outros), e sem dizer isso a leitura natural e que quebrou. -->
    <div id="preview" class="preview" hidden></div>

    <div class="rodape">
      <button id="ajustes" title="Ajustes">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.4.67.75.86.3.17.65.26 1 .26H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Ajustes
      </button>
      <button id="sair">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <main id="palco"></main>

  <button class="fresta" id="fresta" title="Mostrar o painel de venda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>

  <div class="fundo-modal" id="modal">
    <div class="cartao" id="modal-corpo"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
