<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Painel</title>
<style>
  :root {
    --verde: #24c278; --verde-fraco: rgba(36,194,120,.14);
    --fundo: #0f131b; --card: #171c27; --linha: rgba(255,255,255,.08);
    --texto: #e8ecf3; --apagado: #8b94a6; --ambar: #f5a524; --vermelho: #f0506a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fundo); color: var(--texto); display: flex; flex-direction: column;
    font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden; user-select: none; border-left: 1px solid var(--linha);
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { padding: 12px 14px 10px; border-bottom: 1px solid var(--linha); display: flex; align-items: center; gap: 8px; }
  header b { font-size: 13px; font-weight: 650; }
  header .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); flex: 0 0 8px; }
  header .pt.off { background: var(--vermelho); }
  header .num { margin-left: auto; font-size: 10.5px; color: var(--apagado); font-variant-numeric: tabular-nums; }

  .lead { padding: 11px 14px; border-bottom: 1px solid var(--linha); min-height: 66px; }
  .lead .nm { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .ln { font-size: 11.5px; color: var(--apagado); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .tag { display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 6px; font-size: 10.5px; font-weight: 650; background: var(--verde-fraco); color: #5fe0a1; }

  .abas { display: flex; gap: 4px; padding: 8px 10px 0; }
  .abas button { flex: 1; padding: 6px; border-radius: 7px; color: var(--apagado); font-size: 11.5px; font-weight: 600; }
  .abas button.on { background: rgba(255,255,255,.08); color: var(--texto); }

  .busca { padding: 8px 10px 0; }
  .busca input {
    width: 100%; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--linha);
    background: rgba(255,255,255,.03); color: var(--texto); outline: none; font: inherit; font-size: 12px;
  }
  .busca input:focus { border-color: rgba(36,194,120,.45); }

  .corpo { flex: 1; overflow-y: auto; padding: 8px 10px 12px; }
  .corpo::-webkit-scrollbar { width: 8px; }
  .corpo::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 8px; }

  .grp { font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: #6b7486; padding: 10px 4px 5px; }
  .it {
    width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px; border-radius: 8px;
    background: rgba(255,255,255,.035); border: 1px solid transparent; display: flex; align-items: center; gap: 8px;
  }
  .it:hover { background: rgba(255,255,255,.07); border-color: rgba(36,194,120,.3); }
  .it:disabled { opacity: .45; cursor: default; }
  .it .ic { font-size: 10px; color: var(--verde); flex: 0 0 13px; }
  .it .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .n { font-size: 10px; color: var(--apagado); flex: 0 0 auto; }

  .vazio { padding: 24px 12px; text-align: center; color: #6b7486; font-size: 12px; line-height: 1.6; }

  footer { padding: 8px 12px; border-top: 1px solid var(--linha); font-size: 11px; color: #6b7486; display: flex; align-items: center; gap: 8px; min-height: 36px; }
  footer .barra { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; display: none; }
  footer .barra i { display: block; height: 100%; background: var(--verde); width: 0; transition: width .25s; }
  footer button { color: var(--apagado); font-size: 11px; }
  footer button:hover { color: var(--texto); }
</style>
</head>
<body>
  <header>
    <span class="pt" id="pt"></span><b>Sellwave</b>
    <span class="num" id="meu"></span>
  </header>

  <div id="trocado" style="display:none;margin:8px 10px 0;padding:8px 10px;border-radius:8px;background:rgba(240,80,106,.12);border:1px solid rgba(240,80,106,.3);color:#ffb3bf;font-size:11.5px"></div>

  <div class="lead" id="lead">
    <div class="nm">Abra uma conversa</div>
    <div class="ln">o painel segue quem está na tela</div>
  </div>

  <div class="abas">
    <button data-aba="msg" class="on">Respostas</button>
    <button data-aba="seq">Funis</button>
    <button data-aba="mid">Áudios</button>
  </div>
  <div class="busca"><input id="busca" placeholder="Procurar" spellcheck="false" /></div>
  <div class="corpo" id="corpo"></div>

  <footer>
    <span id="rod">carregando</span>
    <span class="barra" id="barra"><i></i></span>
    <button id="parar" style="display:none">Parar</button>
  </footer>

  <script src="painel-ui.js"></script>
</body>
</html>
