<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- `swmedia:` e o esquema que o processo principal resolve (ver main.js): e por ele que a previa
     mostra a foto e o video de verdade, em vez de um balao escrito "[imagem] Formula". A pagina
     continua SEM poder falar com a rede - nao ha connect-src, nao ha http: em lugar nenhum - e
     continua com default-src 'none'. Ela so pede ao app, que busca e devolve. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: swmedia:; media-src swmedia:; font-src 'self' data:;" />
<title>Painel</title>
<link rel="stylesheet" href="fonte/mulish.css" />
<style>
  /* ═══════════════════════════════════════════════════════════════════════════════════════════
     O PAINEL É O MESMO DO INBOX DA DASH.
     Pedido do Bruno em 16/10: "quero que fique igualzinho, idêntico ao que a gente tem hoje no
     inbox de WhatsApp, inclusive a personalização".

     As cores NÃO são as do tema escuro da dash: o painel do inbox vive dentro do `.wa-scope`, que
     reescreve os tokens pra paleta do WhatsApp Web escuro. Por isso aqui o fundo é #111b21 e não
     #171c27, e o texto apagado é #8696a0 e não #90a1b9. Resolver pelo tema global sairia errado.
     ═══════════════════════════════════════════════════════════════════════════════════════════ */
  :root {
    --fundo: #111b21;          /* fundo do painel */
    --conversa: #0b141a;       /* bandeja da prévia, imita o fundo da conversa */
    --texto: #e9edef;
    --apagado: #8696a0;
    --linha: rgba(32, 44, 51, .6);
    --fraco: rgba(32, 44, 51, .2);
    --hover: rgba(32, 44, 51, .4);
    --borda: rgba(134, 150, 160, .15);
    --verde: #00a884;          /* o emerald do .wa-scope */
    --balao: #005c4b;          /* balão de saída */
    --roxo: #ad46ff;           /* funil */
    --ambar: #ffb900;
    --azul: #53bdeb;           /* o mesmo azul de link do WhatsApp */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; height: 100%;
    background: var(--fundo); color: var(--texto);
    font-family: Mulish, "Segoe UI", system-ui, sans-serif; font-size: 13px; line-height: 1.4;
    border-left: 1px solid var(--linha);
    overflow: hidden; user-select: none; color-scheme: dark;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }

  /* ─────────────── topo ─────────────── */
  .topo { display: flex; align-items: center; gap: 8px; padding: 10px 12px 9px; border-bottom: 1px solid var(--linha); }
  .topo .pt { width: 8px; height: 8px; border-radius: 50%; background: var(--verde); flex: 0 0 8px; }
  .topo .pt.off { background: #f0506a; }
  .topo b { font-size: 13px; font-weight: 700; }
  .topo .meu { margin-left: auto; font-size: 10.5px; color: var(--apagado); font-variant-numeric: tabular-nums; }
  .topo .ic { color: var(--apagado); display: flex; padding: 4px; border-radius: 6px; }
  .topo .ic:hover { background: var(--hover); color: var(--texto); }
  /* O X FECHA O NUMERO, os outros dois nao mexem na sessao. Era o mais consequente dos tres e
     estava com o mesmo cinza dos outros. */
  .topo .ic.sair { padding: 4px 5px; border: 1px solid rgba(240, 80, 106, .35); color: #ff8c9e; }
  .topo .ic.sair:hover { background: rgba(240, 80, 106, .16); border-color: #f0506a; color: #ffb3bf; }

  #trocado { display: none; margin: 8px 8px 0; padding: 8px 10px; border-radius: 10px;
    background: rgba(240, 80, 106, .12); border: 1px solid rgba(240, 80, 106, .3); color: #ffb3bf; font-size: 11.5px; }

  /* ─────────────── lead ─────────────── */
  .lead { padding: 10px 12px; border-bottom: 1px solid var(--linha); min-height: 62px; }
  .lead .nm { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .ln { font-size: 11.5px; color: var(--apagado); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead .tag { display: inline-block; margin-top: 6px; padding: 2px 7px; border-radius: 9999px;
    font-size: 9px; font-weight: 700; background: rgba(0, 168, 132, .13); color: var(--verde);
    text-transform: uppercase; letter-spacing: .04em; }

  /* ─────────────── abas ─────────────── */
  .abas { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 8px; border-bottom: 1px solid var(--linha); }
  .aba {
    position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 6px 0; border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--apagado);
    transition: background-color .15s, color .15s;
  }
  .aba svg { width: 16px; height: 16px; }
  .aba:hover { background: var(--hover); }
  .aba.on { background: var(--fraco); color: var(--texto); }
  .aba .selo[hidden] { display: none; }   /* [hidden] perde pra qualquer `display` na regra */
  .aba .selo { position: absolute; right: 4px; top: 2px; display: grid; place-items: center; min-width: 16px;
    padding: 0 4px; border-radius: 9999px; background: var(--verde); font-size: 9px; font-weight: 700; line-height: 16px; color: #fff; }

  /* ─────────────── busca e filtros ─────────────── */
  .cabeca { padding: 8px; border-bottom: 1px solid var(--linha); }
  .cabeca > * + * { margin-top: 8px; }
  .busca { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px;
    border: 1px solid var(--borda); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  .busca:focus-within { border-color: rgba(153, 161, 175, .6); box-shadow: 0 0 0 3px rgba(0, 168, 132, .15); }
  .busca svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--apagado); }
  .busca input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; font-size: 13px; }
  .busca input::placeholder { color: var(--apagado); }

  .linha-chips { display: flex; align-items: flex-start; gap: 6px; }
  .chips { display: flex; flex: 1; flex-wrap: wrap; gap: 6px; }
  .fav-filtro { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0;
    border: 1px solid var(--borda); border-radius: 999px; background: transparent; color: var(--apagado);
    transition: background-color .15s, border-color .15s, color .15s; }
  .fav-filtro svg { width: 16px; height: 16px; }
  .fav-filtro:hover { background: var(--hover); }
  .fav-filtro.on { border-color: rgba(251, 191, 36, .6); background: rgba(251, 191, 36, .1); color: #fbbf24; }
  .chip { display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0;
    border: 1px solid var(--borda); border-radius: 10px; background: transparent;
    transition: background-color .15s, border-color .15s; color: var(--kc); }
  .chip svg { width: 16px; height: 16px; }
  .chip:hover { background: var(--hover); }
  .chip.on { border-color: var(--kc); background: color-mix(in srgb, var(--kc) 12%, transparent); box-shadow: inset 0 0 0 1px var(--kc); }

  /* ─────────────── lista ─────────────── */
  .rolo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px; }
  .rolo::-webkit-scrollbar { width: 8px; }
  .rolo::-webkit-scrollbar-track { background: transparent; }
  .rolo::-webkit-scrollbar-thumb { background: #6a7282; border-radius: 4px; border: 1px solid transparent; background-clip: padding-box; }

  .sec { display: flex; width: 100%; align-items: center; gap: 6px; margin: 0 0 6px; padding: 0 2px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--kc); }
  .sec svg:first-child { width: 14px; height: 14px; flex-shrink: 0; }
  .sec .n { padding: 1px 6px; border-radius: 9999px; font-size: 10px; font-weight: 700; line-height: 1;
    background: color-mix(in srgb, var(--kc) 13%, transparent); color: var(--kc); }
  .sec .seta { margin-left: auto; width: 14px; height: 14px; color: var(--apagado); transition: transform .15s; }
  .sec.fechada .seta { transform: rotate(-90deg); }

  .grp { display: flex; align-items: center; gap: 6px; padding: 6px 2px 4px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--apagado); }
  .grp > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp:not(.primeiro) { margin-top: 4px; border-top: 1px solid var(--linha); padding-top: 10px; }
  .grp .n { padding: 1px 6px; border-radius: 9999px; font-size: 9px; font-weight: 700; line-height: 1;
    background: color-mix(in srgb, var(--ac) 13%, transparent); color: var(--ac); }

  .item { border: 1px solid var(--linha); border-radius: 14px; background: var(--fraco);
    transition: transform .15s, box-shadow .15s, border-color .15s; animation: entra .15s ease both; margin-bottom: 6px; }
  .item:hover { transform: translateY(-1px); border-color: var(--kc); box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); }
  @keyframes entra { from { opacity: 0; transform: translate3d(0, 4px, 0); } }
  .item-linha { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
  .item-ic { display: grid; place-items: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
    background: color-mix(in srgb, var(--kc) 15%, transparent); color: var(--kc); }
  .item-ic svg { width: 16px; height: 16px; }
  .item-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; font-size: 13px; color: var(--texto); }
  .estrela { display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0; color: rgba(134,150,160,.4); }
  .estrela:hover { color: var(--ambar); }
  .estrela.on { color: var(--ambar); }
  .estrela svg { width: 14px; height: 14px; }
  .enviar { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: 8px;
    background: rgba(0, 79, 59, .5); color: #5ee9b5; transition: background-color .15s; }
  .enviar:hover { background: #004f3b; }
  .enviar:disabled { opacity: .45; cursor: default; }
  .enviar svg { width: 14px; height: 14px; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .girando { animation: gira .9s linear infinite; }

  .prev { border-top: 1px solid var(--linha); padding: 8px; animation: entraCima .15s ease both; }
  @keyframes entraCima { from { opacity: 0; transform: translate3d(0, -4px, 0); } }
  .prev-bandeja { display: flex; padding: 10px; border-radius: 10px; background: var(--conversa); }
  .prev-balao { margin-left: auto; width: fit-content; max-width: 88%; padding: 6px 8px 4px;
    background: var(--balao); border-radius: 8px 0 8px 8px; font-size: 12px; line-height: 16px;
    color: var(--texto); white-space: pre-wrap; word-break: break-word; }
  .prev-balao .neg { font-weight: 700; }
  .prev-balao .ita { font-style: italic; }
  .prev-balao .ris { text-decoration: line-through; }
  .prev-balao .mono { font-family: Consolas, "Courier New", monospace; font-size: .92em; }
  .prev-hora { display: block; margin-top: 2px; text-align: right; font-size: 10px; color: rgba(233,237,239,.6); }

  /* A MIDIA DENTRO DO BALAO. Mesma largura do balao do WhatsApp e o conteudo manda na altura; o
     teto de 300px existe pra uma foto em pe nao empurrar a lista inteira pra fora da tela. */
  .prev-balao.midia { max-width: 92%; padding: 4px 4px 3px; }
  .prev-balao.midia.audio, .prev-balao.midia.doc { padding: 7px 8px 4px; min-width: 230px; }
  .prev-img, .prev-vid { display: block; width: 100%; max-height: 300px; border-radius: 7px;
    object-fit: contain; background: #000; }
  .prev-vid { max-height: 320px; }
  .prev-aud { display: block; width: 100%; height: 34px; }
  /* O documento nao abre aqui dentro: mostra o nome e abre no programa do Windows. */
  .prev-doc { display: flex; align-items: center; gap: 8px; width: 100%; padding: 2px 0;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .prev-doc svg { width: 18px; height: 18px; flex: 0 0 18px; color: #f0810f; }
  .prev-doc span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-decoration: underline; text-underline-offset: 2px; }
  .prev-doc:hover span { color: #fff; }
  .prev-cap { margin-top: 4px; padding: 0 3px; }

  .funil { border: 1px solid var(--linha); border-radius: 10px; margin-bottom: 6px; }
  .funil-linha { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .funil-ic { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 8px; background: rgba(173, 70, 255, .2); color: var(--roxo); }
  .funil-ic svg { width: 16px; height: 16px; }
  .funil-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: left; font-size: 13px; color: var(--texto); }
  .funil-lbl .passos { margin-left: 4px; font-size: 11px; color: var(--apagado); }
  .funil-prev { border-top: 1px solid var(--linha); padding: 10px; font-size: 12px; line-height: 16px; color: var(--apagado); }
  .passo { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .passo-ic { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0;
    border-radius: 8px; background: color-mix(in srgb, var(--kc) 15%, transparent); color: var(--kc); }
  .passo-ic svg { width: 12px; height: 12px; }
  .passo-n { width: 12px; flex-shrink: 0; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--apagado); }
  .passo-lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .passo-pausa { font-size: 10px; flex-shrink: 0; }

  .vazio { padding: 24px; text-align: center; font-size: 12px; line-height: 16px; color: var(--apagado); }

  /* ─────────────── pedido ───────────────
     NÃO EXISTE BOTÃO DE PEDIDO NO BLOCO DO CLIENTE (16/10/2026). Nasceu aqui, e o Bruno mandou tirar
     no mesmo dia: "gostaria que não tivesse esse botãozinho de Pedido, que o pedido só fosse feito
     na hora que clicar na área de Pedidos". Uma porta por função; a aba já é a porta. */

  /* ─────────────── tipo de pagamento ───────────────
     O MESMO PRIMEIRO PASSO DA DASH (pedido do Bruno em 16/10: "aparecessem aqueles dois botões ali
     nas mesmas cores, verde e azul"). Na dash são dois cartões lado a lado; aqui a coluna é estreita
     demais pra isso, então empilham. As cores e os ícones são os de lá, que é o que ele reconhece. */
  .tipo { display: grid; gap: 8px; padding: 2px; }
  /* EMPILHADO E MAIOR (16/10, ele vendo rodando: o subtitulo estava grudado no titulo e os cartoes
     pequenos demais). Icone em cima, titulo, subtitulo embaixo - que e o desenho da dash. */
  .tipo-cx { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%;
    padding: 18px 14px; border: 1px solid var(--borda); border-radius: 16px; text-align: center;
    transition: border-color .15s, background-color .15s, transform .15s; }
  .tipo-cx:hover { transform: translateY(-1px); }
  .tipo-cx .ic { display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; border-radius: 15px; }
  .tipo-cx .ic svg { width: 25px; height: 25px; }
  .tipo-cx .t1 { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.2; }
  .tipo-cx .t2 { display: block; margin-top: 4px; font-size: 11.5px; line-height: 1.35; color: var(--apagado); }
  .tipo-cx.ent { border-color: rgba(0, 168, 132, .35); background: rgba(0, 168, 132, .07); }
  .tipo-cx.ent:hover { border-color: var(--verde); background: rgba(0, 168, 132, .13); }
  .tipo-cx.ent .ic { background: rgba(0, 168, 132, .16); color: var(--verde); }
  .tipo-cx.ant { border-color: rgba(59, 130, 246, .35); background: rgba(59, 130, 246, .07); }
  .tipo-cx.ant:hover { border-color: #3b82f6; background: rgba(59, 130, 246, .13); }
  .tipo-cx.ant .ic { background: rgba(59, 130, 246, .16); color: #60a5fa; }

  /* ─────────────── blocos do pedido ───────────────
     Na dash são três COLUNAS (Dados do Cliente, Endereço, Tratamento e Anexo). Aqui a coluna é fina,
     então viram três blocos empilhados, na mesma ordem e com os mesmos títulos — foi o que ele pediu:
     "primeiro os dados do cliente, depois rolando para baixo o endereço, e depois o tratamento". */
  /* COR POR BLOCO (16/10: "estao muito, muito cinza"). Fundo translucido na cor do bloco e o
     iconezinho colorido; o texto segue apagado, senao tres titulos berrando competem entre si e
     com o que importa, que sao os campos. A cor identifica a secao de relance, nao enfeita. */
  .bloco { border: 1px solid color-mix(in srgb, var(--bc) 28%, transparent); border-radius: 14px;
    background: color-mix(in srgb, var(--bc) 7%, transparent); padding: 11px; margin-bottom: 9px; }
  .bloco > h3 { display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--bc); }
  .bloco > h3 svg { width: 14px; height: 14px; }
  .bloco input, .bloco textarea, .bloco .lista-bt { background: rgba(11, 20, 26, .45); }

  .selo-tipo { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 9999px;
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .selo-tipo.ent { background: rgba(0, 168, 132, .16); color: var(--verde); }
  .selo-tipo.ant { background: rgba(59, 130, 246, .16); color: #60a5fa; }

  /* O TOTAL E UM BLOCO CHEIO, nao um campo: ele precisa de mais respiro que o espaco padrao entre
     campos (8px), senao o rotulo do campo seguinte encosta na borda dele e os dois viram um so
     bloco. Pedido do Bruno em 16/10: "observacoes esta muito grudado no bloquinho do total". */
  .total { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    margin-top: 10px; margin-bottom: 16px; padding: 9px 11px; border-radius: 11px;
    background: rgba(0, 168, 132, .1); border: 1px solid rgba(0, 168, 132, .25); }
  .total .r { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--verde); }
  .total .v { font-size: 17px; font-weight: 800; color: var(--verde); font-variant-numeric: tabular-nums; }
  .total.vazio { background: var(--fraco); border-color: var(--borda); }
  .total.vazio .r, .total.vazio .v { color: var(--apagado); }

  /* ── O QUE VEIO DA BUSCA DE CEP ─────────────────────────────────────────────────────────
     Cadeado no rotulo e campo so de leitura: o endereco que a base trouxe nao se corrige na mao,
     porque a proxima tecla no CEP apagaria a correcao. Mexeu no CEP, tudo solta. */
  .form label .cad { width: 10px; height: 10px; margin-left: 4px; vertical-align: -1px; opacity: .55; }
  .form input[readonly] { background: rgba(255,255,255,.03); color: var(--apagado); cursor: default; }
  /* O sinal da busca fica DENTRO do campo, a direita. */
  .form .com-sinal { position: relative; }
  .cep-sinal { position: absolute; right: 9px; top: 50%; transform: translateY(2px); display: inline-flex; }
  .cep-sinal svg { width: 14px; height: 14px; }
  .cep-sinal.ok { color: var(--verde); }
  .cep-sinal.gira { color: var(--apagado); }
  /* A dica embaixo do campo: diz o que falta, em vez de so pintar de vermelho. */
  .dica-campo { display: block; margin-top: 3px; font-size: 10px; line-height: 13px; color: #f0506a; }

  /* ── VENDA FUTURA ───────────────────────────────────────────────────────────────────────
     Mesmo ambar da dash: e um estado do pedido, nao um campo a mais. */
  .vf { margin-top: 8px; padding: 9px 11px; border-radius: 11px; border: 1px solid var(--borda); }
  .vf.on { border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.07); }
  .vf-topo { display: flex; align-items: center; gap: 8px; width: 100%; padding: 0;
    background: none; border: 0; color: var(--texto); font: inherit; font-weight: 650; cursor: pointer; text-align: left; }
  .vf-topo svg { width: 14px; height: 14px; color: #f59e0b; }
  .vf.on .vf-topo { color: #f59e0b; }
  .cxk { display: grid; place-items: center; width: 16px; height: 16px; flex: 0 0 16px;
    border-radius: 5px; border: 1.5px solid rgba(134, 150, 160, .35); }
  .cxk.on { background: #f59e0b; border-color: #f59e0b; color: #1a1205; }
  .cxk svg { width: 11px; height: 11px; stroke-width: 3; }
  .vf-lbl { display: block; margin: 9px 0 3px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--apagado); }
  .vf-data { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px;
    border-radius: 9px; border: 1px solid var(--borda); background: var(--fraco); color: var(--texto);
    font: inherit; font-size: 12.5px; cursor: pointer; text-align: left; }
  .vf-data svg { width: 14px; height: 14px; color: #f59e0b; flex: 0 0 14px; }
  .vf-data:hover { border-color: rgba(134, 150, 160, .35); }
  .vf-data.erro { border-color: #f0506a; }

  /* O CALENDARIO E PROPRIO pelo mesmo motivo do seletor de tratamento: o do Windows e desenhado
     pelo sistema, sai branco e ignora o tema. */
  .cal { margin-top: 8px; padding: 9px; border-radius: 10px; border: 1px solid var(--borda); background: var(--fraco); }
  .cal-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px;
    font-size: 11.5px; font-weight: 700; text-transform: capitalize; }
  .cal-nav { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px;
    border: 0; background: none; color: var(--apagado); cursor: pointer; }
  .cal-nav:hover:not(:disabled) { background: rgba(255,255,255,.06); color: var(--texto); }
  .cal-nav:disabled { opacity: .25; cursor: default; }
  .cal-nav svg { width: 14px; height: 14px; }
  .cal-grade { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-ds { display: grid; place-items: center; height: 20px; font-size: 9.5px; font-weight: 700;
    color: var(--apagado); }
  .cal-dia { display: grid; place-items: center; height: 28px; border-radius: 7px; border: 0;
    background: none; color: var(--texto); font: inherit; font-size: 12px; cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .cal-dia:hover:not(:disabled) { background: rgba(245,158,11,.15); }
  .cal-dia:disabled { opacity: .2; cursor: default; }
  .cal-dia.on { background: #f59e0b; color: #1a1205; font-weight: 800; }

  /* ── PRAZO E JEITO DE MANDAR ────────────────────────────────────────────────────────────
     A escolha MUDA O PRAZO que o vendedor promete ao cliente, por isso ela fica colada na
     previsao em vez de escondida num seletor. */
  .prazo { margin-top: 8px; padding: 9px 11px; border-radius: 11px;
    border: 1px solid var(--borda); background: var(--fraco); }
  .prazo-l { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
  .prazo-l svg { width: 15px; height: 15px; color: #53bdeb; flex: 0 0 15px; }
  .prazo-l b { font-weight: 800; }
  .prazo-s { margin-top: 2px; font-size: 10.5px; line-height: 14px; color: var(--apagado); }
  .prazo-ops { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .prazo-op { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--borda);
    background: none; color: var(--apagado); font: inherit; font-size: 11px; cursor: pointer; }
  .prazo-op:hover { border-color: rgba(134, 150, 160, .35); color: var(--texto); }
  .prazo-op.on { background: rgba(0,188,242,.16); border-color: rgba(0,188,242,.45); color: #53bdeb; font-weight: 650; }

  .anexo { display: flex; align-items: center; gap: 9px; width: 100%; padding: 11px;
    border: 1px dashed var(--borda); border-radius: 11px; color: var(--apagado);
    transition: border-color .15s, color .15s, background-color .15s; }
  .anexo:hover { border-color: var(--verde); color: var(--texto); background: rgba(0, 168, 132, .05); }
  .anexo svg { width: 16px; height: 16px; flex-shrink: 0; }
  .anexo.tem { border-style: solid; border-color: rgba(0, 168, 132, .4); color: var(--texto); background: rgba(0, 168, 132, .07); }
  .anexo .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; text-align: left; }

  .form { padding: 2px; }
  .form .cx { margin-bottom: 8px; }
  .form .cx.par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form .cx.uf { grid-template-columns: 1fr 62px; }
  .form label { display: block; margin-bottom: 3px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: var(--apagado); }
  .form input, .form select, .form textarea {
    width: 100%; height: 34px; padding: 0 9px; border: 1px solid var(--borda); border-radius: 9px;
    background: var(--fraco); color: var(--texto); font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .form textarea { height: 56px; padding: 7px 9px; resize: none; line-height: 1.35; }
  /* NADA DE <select> (16/10: "os select ficam BRANCOS e so dao pra ler passando o mouse"). O
     <option> nativo no Windows e desenhado pelo sistema e NAO aceita tema: o fundo sai branco por
     mais CSS que se escreva. Entao e lista propria. */
  .sel { position: relative; }
  .lista-bt { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 9px;
    border: 1px solid var(--borda); border-radius: 9px; background: var(--fraco); color: var(--texto);
    font-size: 13px; text-align: left; transition: border-color .15s, box-shadow .15s; }
  .lista-bt:disabled { opacity: .6; cursor: default; }
  .lista-bt .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lista-bt .v.vazio { color: rgba(134, 150, 160, .75); }
  .lista-bt svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--apagado); transition: transform .15s; }
  .sel.aberta .lista-bt { border-color: rgba(153, 161, 175, .6); box-shadow: 0 0 0 3px rgba(0, 168, 132, .15); }
  .sel.aberta .lista-bt svg { transform: rotate(180deg); }
  .lista-op { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
    max-height: 230px; overflow-y: auto; padding: 4px; border: 1px solid var(--borda); border-radius: 11px;
    background: #0e181f; box-shadow: 0 10px 28px rgba(0, 0, 0, .55); }
  .sel.aberta .lista-op { display: block; }
  .lista-op button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 9px;
    border-radius: 8px; font-size: 12.5px; text-align: left; color: var(--texto); }
  .lista-op button:hover { background: var(--hover); }
  .lista-op button.on { background: rgba(0, 168, 132, .16); color: var(--verde); font-weight: 700; }
  .lista-op button .p { margin-left: auto; font-size: 11px; color: var(--apagado); font-variant-numeric: tabular-nums; }
  .lista-op button.on .p { color: var(--verde); }
  .lista-op::-webkit-scrollbar { width: 8px; }
  .lista-op::-webkit-scrollbar-thumb { background: #6a7282; border-radius: 4px; border: 1px solid transparent; background-clip: padding-box; }

  /* de quem e o pedido, congelado desde que o formulario abriu */
  .dono-ped { display: flex; flex-direction: column; align-items: stretch; gap: 7px; margin-bottom: 9px;
    padding: 8px 10px; border-radius: 10px; background: rgba(0, 168, 132, .08); border: 1px solid rgba(0, 168, 132, .22); }
  .dono-ped .l { display: flex; align-items: center; gap: 7px; }
  .dono-ped .l svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--verde); }
  .dono-ped .q { flex: 1; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dono-ped .a { font-size: 10px; color: var(--ambar); font-weight: 700; }
  /* CONVERSA TROCADA COM O PEDIDO ABERTO (16/10/2026, pedido do Bruno). Era so um rotulo de 10px no
     canto, e a consequencia de nao ver e cadastrar pedido pro cliente errado: ele pediu que ficasse
     "um pouco mais destacado, pra que o meu vendedor nao confunda e acabe subindo um pedido pra um
     cliente que ja saiu". Entao o bloco inteiro vira ambar e ganha SAIDA, que e o que faltava:
     avisar sem oferecer o que fazer so deixa o vendedor parado. */
  .dono-ped.trocou { background: rgba(255, 185, 0, .1); border-color: rgba(255, 185, 0, .38); }
  .dono-ped.trocou .l svg { color: var(--ambar); }
  .bt-troca { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    height: 32px; padding: 0 10px; border-radius: 9px; background: var(--ambar); color: #2a1d00;
    font-size: 12px; font-weight: 700; transition: background-color .15s; }
  .bt-troca:hover { background: #ffc933; }
  .bt-troca:disabled { opacity: .5; cursor: default; }
  .bt-troca svg { width: 13px; height: 13px; flex-shrink: 0; color: inherit; }
  .bt-troca span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .form input:focus, .form select:focus, .form textarea:focus {
    border-color: rgba(153, 161, 175, .6); box-shadow: 0 0 0 3px rgba(0, 168, 132, .15); }
  .form input::placeholder, .form textarea::placeholder { color: rgba(134, 150, 160, .55); }
  /* O CAMPO QUE FALTA FICA VERMELHO, mas só depois de tentar cadastrar: pintar enquanto a pessoa
     ainda está preenchendo é só barulho. Mesma regra do botão vermelho das Aceitações. */
  .form .erro input, .form .erro select { border-color: rgba(240, 80, 106, .7); }
  .form .erro label { color: #ffb3bf; }

  .aviso { margin-bottom: 8px; padding: 8px 10px; border-radius: 10px; font-size: 11.5px; line-height: 15px; }
  .aviso.ruim { background: rgba(240, 80, 106, .12); border: 1px solid rgba(240, 80, 106, .3); color: #ffb3bf; }
  .aviso.bom { background: rgba(0, 168, 132, .12); border: 1px solid rgba(0, 168, 132, .3); color: #7ee8c6; }
  .aviso ul { margin: 4px 0 0; padding-left: 16px; }

  .acoes { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 10px; }
  .bt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px;
    padding: 0 12px; border-radius: 10px; font-size: 12.5px; font-weight: 700; transition: background-color .15s, opacity .15s; }
  .bt svg { width: 14px; height: 14px; }
  .bt.pri { background: var(--verde); color: #04231c; }
  .bt.pri:hover { background: #00bf96; }
  .bt.sec { border: 1px solid var(--borda); color: var(--apagado); }
  .bt.sec:hover { background: var(--hover); color: var(--texto); }
  .bt:disabled { opacity: .45; cursor: default; }

  .rasc { display: flex; align-items: center; gap: 9px; padding: 7px 9px; margin-bottom: 6px;
    border: 1px solid var(--linha); border-radius: 11px; background: var(--fraco); }
  .rasc .ic { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 9px; background: rgba(255, 185, 0, .14); color: var(--ambar); }
  .rasc .ic svg { width: 14px; height: 14px; }
  .rasc .txt { flex: 1; min-width: 0; text-align: left; }
  .rasc .t1 { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rasc .t2 { margin-top: 1px; font-size: 10.5px; color: var(--apagado); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rasc .x { display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 7px; color: rgba(134,150,160,.5); }
  .rasc .x:hover { background: rgba(240, 80, 106, .14); color: #f0506a; }
  .rasc .x svg { width: 13px; height: 13px; }

  /* ─────────────── o que está saindo ───────────────
     A "pilha de disparos" que o Bruno perguntou se já existia. Não existia. Hoje ela mostra 0 ou 1,
     porque o painel roda um funil por vez no app inteiro; o desenho já é de lista pro dia em que
     isso mudar. Fica no topo da aba Funis, que é de onde o disparo sai. */
  /* IGUAL A PILHA DO INBOX (16/10: "deveria ser exatamente o mesmo que a gente usa no inbox, com as
     mesmas informacoes"). A referencia e o PilhaEnvios do chat.jsx no modo integrado: cartao com
     borda verde, cabecalho SOLIDO verde com a contagem, e uma linha por envio com a rodinha girando,
     "Funil: <nome> -> <quem>" e "Enviando passo X de Y". O verde e o emerald-500 da dash (#10b981),
     nao o do .wa-scope: la o cabecalho e solido nessa cor e e o que ele reconhece de relance. */
  .saindo { margin-bottom: 9px; border: 1px solid rgba(16, 185, 129, .4); border-radius: 12px;
    background: var(--fraco); overflow: hidden; }
  .saindo .cab { display: flex; align-items: center; gap: 8px; padding: 7px 11px;
    background: #10b981; color: #fff; font-size: 12.5px; font-weight: 600; }
  .saindo .cab .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roda { width: 13px; height: 13px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: gira .9s linear infinite; }
  .saindo .item-env { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-top: 1px solid var(--linha); }
  .saindo .item-env .roda { border-color: rgba(16, 185, 129, .25); border-top-color: #10b981; }
  .saindo .item-env .txt { flex: 1; min-width: 0; }
  .saindo .l1 { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saindo .l1 .rot { color: #34d399; }
  .saindo .l1 .para { color: var(--apagado); font-weight: 400; }
  .saindo .l2 { margin-top: 1px; font-size: 11px; color: var(--apagado);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* QUEM ESPERA A VEZ fica com o ponto PARADO, e quem anda com a rodinha girando: e assim que se
     separa de longe quem esta saindo de quem esta na fila. Mesma regra do inbox. */
  .pt-fila { width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: rgba(134, 150, 160, .45); }
  .saindo .cab .pt-fila { background: rgba(255, 255, 255, .65); }
  .saindo .item-env .x { display: grid; place-items: center; width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 7px; color: rgba(134, 150, 160, .55); }
  .saindo .item-env .x:hover { background: rgba(240, 80, 106, .16); color: #f0506a; }
  .saindo .item-env .x svg { width: 13px; height: 13px; }
  .saindo .dono { margin-top: 1px; font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; color: rgba(134, 150, 160, .7); }

  /* ─────────────── rodapé ─────────────── */
  footer { padding: 8px 12px; border-top: 1px solid var(--linha); font-size: 11px; color: var(--apagado);
    display: flex; align-items: center; gap: 8px; min-height: 36px; }
  footer .barra { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; display: none; }
  footer .barra i { display: block; height: 100%; background: var(--verde); width: 0; transition: width .25s; }
  footer button { color: var(--apagado); font-size: 11px; }
  footer button:hover { color: var(--texto); }
</style>
</head>
<body>
  <div class="topo">
    <span class="pt" id="pt"></span><b>SellWave</b>
    <span class="meu" id="meu"></span>
    <button class="ic" id="esconder" title="Esconder o painel (volta em Ajustes)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
    <button class="ic" id="recarregar" title="Recarregar o WhatsApp">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="ic sair" id="fechar" title="Fechar este número (a sessão fica salva)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div id="trocado"></div>

  <div class="lead" id="lead">
    <div class="nm">Abra uma conversa</div>
    <div class="ln">o painel segue quem está na tela</div>
  </div>

  <div class="abas">
    <button class="aba on" data-aba="itens">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Itens
    </button>
    <button class="aba" data-aba="funis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"/></svg>Funis
      <span class="selo" id="selo-funis" hidden></span>
    </button>
    <button class="aba" data-aba="pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M14 2v6h6"/><path d="M9 14h6"/><path d="M9 18h4"/></svg>Pedidos
      <span class="selo" id="selo-pedidos" hidden></span>
    </button>
  </div>

  <div class="cabeca" id="cabeca">
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" placeholder="Buscar item..." spellcheck="false" />
    </div>
    <div class="linha-chips" id="linha-chips">
      <div class="chips" id="chips"></div>
      <button class="fav-filtro" id="fav-filtro" title="Apenas favoritos" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1L12 2Z"/></svg>
      </button>
    </div>
  </div>

  <div class="rolo" id="corpo"></div>

  <footer>
    <span id="rod">carregando</span>
    <span class="barra" id="barra"><i></i></span>
    <button id="parar" style="display:none">Parar</button>
  </footer>

  <script src="painel-ui.js"></script>
</body>
</html>
