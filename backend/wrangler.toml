# ════════════════════════════════════════════════════════════════
# AXION — Cloudflare Worker (API multi-usuário)
# ════════════════════════════════════════════════════════════════
name = "axion-api"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true   # mantem a URL axion-api.axion-dash.workers.dev viva (a dash usa ela)

# ─── Domínios custom pras pressels (TikTok com domínios diferentes) ──
# Cada domínio serve o Worker; a pressel fica em https://dominio/p/<id>.
# (Já anexados via API; aqui ficam declarados pra não sumirem em deploy.)
# OS 4 DOMINIOS NOVOS (.shop) NAO ENTRAM AQUI AINDA - 27/08/2026.
# O Bruno comprou glico6-painel.shop, glico6-acesso.shop, glico-area.shop e glico-painel.shop
# porque os tres de cima queimaram, mas eles ainda NAO estao na conta Cloudflare. Declarar uma
# route de zona que nao existe faz o `wrangler deploy` SUBIR o script e SO DEPOIS falhar ao anexar
# a rota: o terminal fica vermelho e todo deploy do worker passa a parecer quebrado, inclusive os
# que nao tem nada a ver com dominio. Por isso a ordem e: (1) ele aponta o dominio pro Cloudflare
# e a zona fica `active`, (2) so entao acrescentar a linha aqui e deployar.
# O salvamento na dash ja aceita os quatro (ver _PRESSEL_DOMS no worker.js): o que falta e so a
# pressel RESPONDER neles.
routes = [
  { pattern = "area-acesso.com", custom_domain = true },
  { pattern = "area-glico.fun", custom_domain = true },
  { pattern = "painel-glico.fun", custom_domain = true }
]

# ─── Cron: sincroniza o estado de conexão (wa_conn) com a Evolution a cada 2min ──
# (mantém "conectado/número" certo mesmo com a dash fechada — serve-time confia no wa_conn)
[triggers]
# DE 1 EM 1 MINUTO, e cada batida faz UM passo (ver o scheduled no worker.js). Era */2 fazendo tudo
# junto, e no plano Workers Free (10ms de CPU por invocacao) a batida inteira estourava e morria
# calada: em 18/08/2026 ficamos 4h20 sem capturar lead com a campanha rodando.
crons = ["* * * * *"]

# ─── D1 (SQLite gerenciado) ────────────────────────────────────
# Após `wrangler d1 create axion`, copie o `database_id` exibido
# e cole abaixo (substitui REPLACE-ME).
[[d1_databases]]
binding       = "DB"
database_name = "axion"
database_id   = "a21e7bc2-98fe-4811-b6b0-b016e10a5137"

# ─── R2 (mídia do Sale Chat: áudios/vídeos/imagens que o Diretor sobe) ──
[[r2_buckets]]
binding     = "MEDIA"
bucket_name = "salechat-media"

# ─── Observabilidade ───────────────────────────────────────────
[observability]
enabled = true
